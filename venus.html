<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title> </title>
  <meta name="color-scheme" content="dark light">
  <style>
    :root{
      --bg1:#0c0f14; --bg2:#0a0c12;
      --ring:#7aa7ff; --ring2:#b6c9ff;
      --glow: rgba(122,167,255,0.25);
      --card: rgba(255,255,255,0.06);
      --stroke: rgba(255,255,255,0.08);
    }
    html,body{height:100%;margin:0}
    body{
      font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background: radial-gradient(1200px 800px at 70% -10%, #1a2550 0%, transparent 60%),
                  radial-gradient(1000px 700px at -10% 100%, #0f1a3a 0%, transparent 60%),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      display:flex;align-items:center;justify-content:center;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    .wrap{
      width:100%;max-width:480px;padding:40px;display:flex;align-items:center;justify-content:center;
    }
    .plate{
      width:112px;height:112px;border-radius:24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      border:1px solid var(--stroke);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35), 0 0 60px var(--glow) inset, 0 0 0 1px rgba(255,255,255,0.05) inset;
      position:relative;display:grid;place-items:center;
      backdrop-filter: blur(8px);
    }
    .ring{
      position:absolute;inset:-14px;border-radius:28px;
      background:
        conic-gradient(from 0deg, var(--ring) 0%, var(--ring2) 25%, transparent 50%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent 64px, #000 66px);
              mask: radial-gradient(farthest-side, transparent 64px, #000 66px);
      filter: blur(0.2px);
      animation: spin 1.2s linear infinite;
      opacity:.9;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 品牌字母徽标（可替换为你的 logo svg/png） */
    .logo{
      width:54px;height:54px;border-radius:14px;
      background: radial-gradient(60% 60% at 35% 30%, rgba(255,255,255,0.25), transparent 60%),
                  linear-gradient(180deg, #1c2a50, #0f162d);
      border:1px solid rgba(255,255,255,0.08);
      box-shadow: 0 6px 16px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.06) inset;
      display:flex;align-items:center;justify-content:center;
    }
    .logo svg{display:block}
    /* 可选：轻微呼吸动画，显得更高端 */
    .plate::after{
      content:""; position:absolute; inset:-2px; border-radius:26px;
      box-shadow: 0 0 50px 12px var(--glow);
      animation: pulse 2.4s ease-in-out infinite;
      opacity:.25; pointer-events:none;
    }
    @keyframes pulse { 50% { opacity:.45; } }
    /* 隐藏任何可见文本（我们不展示“正在跳转”等文案） */
    .sr-only{
      position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
    }
  </style>
  <!-- 可选：favicon（SVG 内联，V 字母），可换成你自己的 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs/%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 ry=%2716%27 fill=%27%230d1222%27/%3E%3Cpath d=%27M16 18l16 32L48 18h-7l-9 18-9-18z%27 fill=%27%23a9c4ff%27/%3E%3C/svg%3E">
</head>
<body>
  <div class="wrap">
    <div class="plate" aria-hidden="true">
      <div class="ring"></div>
      <div class="logo" aria-hidden="true">
        <!-- 简洁 V 字徽标（可替换为你的 logo） -->
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 5l11 20L25 5h-4.8L14 16.8 7.8 5H3z" fill="#c9d7ff"/>
        </svg>
      </div>
    </div>
    <!-- 为无障碍设备保留描述，但对视觉完全隐藏 -->
    <span class="sr-only">Loading</span>
  </div>

  <script>
    // 允许的协议
    const ALLOWED = ['http:', 'https:'];

    // Base64 -> UTF-8
    function b64ToUtf8(b64){
      try{
        const bin = atob(b64);
        const pct = Array.prototype.map.call(bin, c => '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)).
		join('');
        return decodeURIComponent(pct);
      }catch(e){ return null; }
    }

    // URL 校验
    function isOk(u){
      try{ const x=new URL(u); return ALLOWED.includes(x.protocol); }
      catch(e){ return false; }
    }

    (function(){
      const sp = new URLSearchParams(location.search);
      let target = null;

      // 支持 ?c=（Base64）优先；或 ?u= 明文
      if (sp.get('c')) target = b64ToUtf8(sp.get('c'));
      else if (sp.get('u')) target = sp.get('u');

      if (!target || !isOk(target)) {
        // 若无有效目标，静默保持视觉效果；可在控制台提示以便你排查
        console.warn('No valid target URL.');
        return;
      }

      // 轻微延迟，保证动画先呈现一帧，体验更润
      setTimeout(()=>{ window.location.replace(target); }, 280);
    })();
  </script>

  <noscript>
    <!-- JS 被禁用时的兜底（隐藏在视觉外，仅供可访问性/备用）
         你可以把上面 JS 的目标改成后端生成，让这里输出一个 <meta refresh> 也行。 -->
  </noscript>
</body>
</html>
