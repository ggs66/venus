<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>外部链接跳转确认（示例）</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--accent:#0b74de;--muted:#6b7280}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:linear-gradient(180deg,#f7f9fd,#f2f5fb)}
    .wrap{max-width:820px;margin:48px auto;padding:24px}
    .card{background:var(--card);border-radius:12px;padding:28px;box-shadow:0 14px 40px rgba(12,34,56,0.06);border:1px solid rgba(11,16,30,0.03)}
    h1{margin:0 0 8px;font-size:20px}
    .lead{color:var(--muted);margin:0}
    .targetBox{margin-top:18px;padding:14px;border-radius:8px;background:#f4f7fb;border:1px dashed rgba(11,116,222,0.12);word-break:break-all;font-weight:600}
    .controls{margin-top:18px;display:flex;gap:12px;align-items:center}
    .btn{padding:10px 16px;border-radius:8px;text-decoration:none;display:inline-block;font-weight:700;cursor:pointer;border:none}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-secondary{background:#eef2f8;color:#0b2b4a}
    .meta{margin-top:12px;color:var(--muted);font-size:13px}
    .warn{margin-top:12px;color:#b43131;font-weight:700}
    .small{font-size:13px;color:var(--muted)}
    .countdown{font-weight:800;color:var(--accent);margin-left:6px}
    .note{margin-top:14px;padding:12px;border-radius:6px;background:#fffbe6;border:1px solid #ffecb5;color:#7a5a00}
    code{background:#f3f4f6;padding:2px 6px;border-radius:4px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-labelledby="title">
      <h1 id="title">外部链接跳转确认（示例）</h1>
      <p class="lead">此页面会解析 URL 参数 <code>?c=</code>（Base64 编码），并展示解码后的目标地址。为安全起见，页面不会自动在后台无声跳转，必须由用户确认后才能前往。</p>

      <div id="content" aria-live="polite" style="margin-top:12px">
        <p class="small">正在解析链接…</p>
      </div>

      <p class="meta">示例：<code>https://yourname.github.io/index.html?c=aHR0cHM6Ly93d3cuN2s3ay5jb20=</code></p>
    </div>
  </div>

<script>
  // 仅允许这些协议
  const ALLOWED_PROTOCOLS = ['http:', 'https:'];

  // 将 Base64 解为 UTF-8 字符串（兼容多字节）
  function base64ToUtf8(b64) {
    try {
      const decoded = atob(b64);
      const percentEncoded = decoded.split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('');
      return decodeURIComponent(percentEncoded);
    } catch(e) { return null; }
  }

  // 基本 XSS 转义（用于展示 URL）
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
  }

  function isValidUrl(u) {
    try {
      const parsed = new URL(u);
      return ALLOWED_PROTOCOLS.includes(parsed.protocol);
    } catch(e) { return false; }
  }

  (function () {
    const params = new URLSearchParams(location.search);
    const c = params.get('c');
    const content = document.getElementById('content');

    if (!c) {
      content.innerHTML = '<p class="small">未提供参数 <code>?c=</code> 。</p>';
      return;
    }

    const target = base64ToUtf8(c);
    if (!target) {
      content.innerHTML = '<p class="warn">无法解码参数，请检查 Base64 是否正确。</p>';
      return;
    }

    if (!isValidUrl(target)) {
      content.innerHTML = `<p>解码结果（但格式不被允许）：</p>
        <div class="targetBox">${escapeHtml(target)}</div>
        <p class="warn">仅允许 http:// 或 https:// 协议。</p>`;
      return;
    }

    // 渲染目标与控件（不会自动跳转）
    content.innerHTML = `
      <p>解码后的目标地址：</p>
      <div class="targetBox" id="targetBox">${escapeHtml(target)}</div>

      <div class="controls">
        <button id="continueBtn" class="btn btn-primary">继续跳转</button>
        <button id="cancelBtn" class="btn btn-secondary">取消</button>
        <div class="small" style="margin-left:auto">在 <span class="countdown" id="cd">5</span> 秒内点击继续可快速前往</div>
      </div>

      <p class="meta">页面会在你确认前显示目标地址和来源信息，请务必确认你信任目标站点。</p>
      <p class="note">示例页仅作学习用途，禁止用于任何恶意或规避行为。</p>
    `;

    // 倒计时视觉提示（不触发跳转）
    const cdEl = document.getElementById('cd'); let cd = 5;
	const timer = setInterval(()=>{ cd-=1; cdEl.textContent = cd; if (cd<=0) clearInterval(timer); }, 1000);
	
	    document.getElementById('cancelBtn').addEventListener('click', ()=>{ alert('已取消跳转'); history.back(); });
	
	    document.getElementById('continueBtn').addEventListener('click', ()=> {
	      // 可选：在这里发送统计到后端（若部署了后端），例如：
	      // navigator.sendBeacon('/log', JSON.stringify({target: target, ts: Date.now()}));
	      window.location.href = target;
	    });
	  })();
	</script>
	</body>
	</html>
